<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>Kino</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="feed"><div class="empty">Yuklanmoqda…</div></div>
    <button id="subBtn" class="sub-pill" hidden></button>
    <button id="profileBtn" class="icon-btn" aria-label="Profil">👤</button>

    <!-- Profil ekrani -->
    <div id="profile" class="screen" hidden>
      <div class="screen-head">
        <button class="back" data-close>‹</button>
        <h2>Profil</h2>
      </div>
      <div class="screen-body">
        <div class="card" id="subCard"></div>
        <div class="card" id="balCard"></div>
        <button class="primary" id="openUpload">➕ Video joylash</button>
        <h3>Mening kontentim</h3>
        <div id="myContent" class="list"></div>
      </div>
    </div>

    <!-- Yuklash ekrani -->
    <div id="upload" class="screen" hidden>
      <div class="screen-head">
        <button class="back" data-close>‹</button>
        <h2>Video joylash</h2>
      </div>
      <div class="screen-body">
        <label class="field"><span>Qisqa REELS video (vertikal)</span><input type="file" id="upReel" accept="video/*" /></label>
        <label class="field"><span>To'liq video</span><input type="file" id="upVideo" accept="video/*" /></label>
        <label class="field"><span>Sarlavha</span><input type="text" id="upTitle" placeholder="Video nomi" /></label>
        <label class="field"><span>Narx (⭐, 0 = bepul)</span><input type="number" id="upPrice" value="0" min="0" /></label>
        <button class="primary" id="doUpload">Yuklash</button>
        <div class="hint">Yuklangач moderatsiyaga yuboriladi. Har fayl maks. 50MB.</div>
      </div>
    </div>

    <div id="toast" class="toast"></div>
    <script src="/app.js"></script>
  </body>
</html>
