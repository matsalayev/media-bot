<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>Media</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@2/dist/tonconnect-ui.min.js"></script>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="feed"><div class="empty">…</div></div>
    <button id="profileBtn" class="icon-btn" aria-label="Profil">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
    </button>

    <!-- Profil ekrani -->
    <div id="profile" class="screen" hidden>
      <div class="screen-head">
        <button class="back" data-close>‹</button>
        <h2 id="lProfile">Profil</h2>
      </div>
      <div class="screen-body">
        <div class="card" id="balCard"></div>
        <div class="card" id="walletCard"></div>
        <button class="primary" id="openUpload">➕</button>
        <h3 id="lMyContent">Mening kontentim</h3>
        <div id="myContent" class="list"></div>
        <h3 id="lLiked">Yoqtirganlar</h3>
        <div id="likedList" class="list"></div>
        <h3 id="lSaved">Saqlangan</h3>
        <div id="savedList" class="list"></div>
      </div>
    </div>

    <!-- Yuklash ekrani -->
    <div id="upload" class="screen" hidden>
      <div class="screen-head">
        <button class="back" data-close>‹</button>
        <h2 id="lUploadTitle">Video joylash</h2>
      </div>
      <div class="screen-body">
        <label class="field"><span id="lFReel">Qisqa REELS video</span><input type="file" id="upReel" accept="video/*" /></label>
        <label class="field"><span id="lFVideo">To'liq video</span><input type="file" id="upVideo" accept="video/*" /></label>
        <label class="field"><span id="lFTitle">Sarlavha</span><input type="text" id="upTitle" /></label>
        <label class="field"><span id="lFPrice">Narx (USDT, 0 = bepul)</span><input type="number" id="upPrice" value="0" min="0" step="0.01" /></label>
        <button class="primary" id="doUpload">Yuklash</button>
        <div class="hint" id="lHint">Maks. 50MB.</div>
      </div>
    </div>

    <div id="toast" class="toast"></div>
    <script src="/app.js"></script>
  </body>
</html>
